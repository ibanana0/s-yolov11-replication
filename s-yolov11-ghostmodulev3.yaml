# S-YOLOv11 + standalone GhostModuleV3.
# Ablation terisolasi: satu blok ekstraksi fitur backbone diganti GhostModuleV3.
# C3k2 lain, downsampling Conv, EMAFPN, dan Detect_ESDCDH tetap dipertahankan.

nc: 10 # VisDrone2019
scales:
  s: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, Conv, [32, 3, 2]] # 0  P1/2
  - [-1, 1, Conv, [64, 3, 2]] # 1  P2/4
  - [-1, 1, C3k2, [128, False, 0.25]] # 2  P2
  - [-1, 1, Conv, [128, 3, 2]] # 3  P3/8
  - [-1, 1, C3k2, [256, False, 0.25]] # 4  P3
  - [-1, 1, Conv, [256, 3, 2]] # 5  P4/16
  - [-1, 1, GhostModuleV3, [256]] # 6  standalone GhostNetV3 feature block
  - [-1, 1, Conv, [512, 3, 2]] # 7  P5/32
  - [-1, 1, C3k2, [512, True]] # 8
  - [-1, 1, SPPF, [512, 5]] # 9
  - [-1, 1, C2PSA, [512]] # 10

head:
  - [4, 1, Conv, [128, 3, 1]] # 11 P3 lateral
  - [6, 1, Conv, [128, 3, 1]] # 12 P4 lateral
  - [10, 1, Conv, [256, 3, 1]] # 13 P5 lateral

  - [12, 1, Conv, [256, 3, 2]] # 14
  - [[13, 14], 1, WFF, [2]] # 15
  - [-1, 1, C3k2, [256, False]] # 16 P5_td

  - [16, 1, EUCB, [128]] # 17
  - [11, 1, Conv, [128, 3, 2]] # 18
  - [[12, 17, 18], 1, WFF, [3]] # 19
  - [-1, 1, C3k2, [128, False]] # 20 P4_td

  - [20, 1, EUCB, [128]] # 21
  - [2, 1, Conv, [128, 3, 2]] # 22
  - [[11, 21, 22], 1, WFF, [3]] # 23
  - [-1, 1, C3k2, [128, False]] # 24 P3_td

  - [24, 1, EUCB, [64]] # 25
  - [2, 1, Conv, [64, 3, 1]] # 26
  - [[26, 25], 1, WFF, [2]] # 27
  - [-1, 1, C3k2, [64, False]] # 28 P2_td

  - [[28, 25], 1, WFF, [2]] # 29
  - [-1, 1, C3k2, [64, False]] # 30 P2_out

  - [30, 1, Conv, [128, 3, 2]] # 31
  - [28, 1, Conv, [128, 3, 2]] # 32
  - [[24, 31, 32], 1, WFF, [3]] # 33
  - [-1, 1, C3k2, [128, False]] # 34 P3_out

  - [34, 1, Conv, [128, 3, 2]] # 35
  - [24, 1, Conv, [128, 3, 2]] # 36
  - [[20, 35, 36], 1, WFF, [3]] # 37
  - [-1, 1, C3k2, [128, False]] # 38 P4_out

  - [38, 1, Conv, [256, 3, 2]] # 39
  - [20, 1, Conv, [256, 3, 2]] # 40
  - [[16, 39, 40], 1, WFF, [3]] # 41
  - [-1, 1, C3k2, [256, False]] # 42 P5_out

  - [[30, 34, 38, 42], 1, Detect_ESDCDH, [nc, 128]] # 43
